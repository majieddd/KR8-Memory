name: KR8 Memory CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memory-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTUP_TOOLCHAIN: "1.95.0"

jobs:
  standalone:
    name: Standalone core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Verify the committed dependency lock
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint every target
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test the standalone workspace
        run: cargo test --workspace --all-targets --locked
      - name: Test documentation examples
        run: cargo test --workspace --doc --locked
      - name: Run the synthetic storage lifecycle
        run: cargo run --locked -p kr8-memory-sqlite --example synthetic_lifecycle
      - name: Preserve the exact dependency lock
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Cargo-lock-${{ matrix.os }}
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 7
